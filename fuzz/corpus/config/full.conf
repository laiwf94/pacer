workers 2
admin_socket /run/pacerd.sock
drain_timeout 10s
log_level info

listener web {
    listen 0.0.0.0:8080
    upstream [::1]:9000
    max_conns 5000
    buffer 32k
    connect_timeout 250ms
    idle_timeout 2m
    min_rate 64 per 10s
    per_ip_max_conns 20
    per_ip_conn_rate 10/s burst 20
    per_ip_bandwidth 1m/s burst 256k
    bandwidth 600/m
    table_size 4096
    table_full evict
    ipv6_prefix 56
}
