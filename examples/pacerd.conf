# Example pacerd config. Addresses are numeric; pacerd does no DNS.
workers 2
admin_socket /run/pacerd/admin.sock
drain_timeout 30s
log_level info

listener web {
    listen 0.0.0.0:8080
    upstream 127.0.0.1:9000

    # Whole listener: at most 10000 open connections and 100 MiB/s.
    max_conns 10000
    bandwidth 100m/s burst 1m

    # Each client address (IPv6 clients grouped by /64): 20 open
    # connections, 10 new ones per second with bursts of 20, and 1 MiB/s.
    per_ip_max_conns 20
    per_ip_conn_rate 10/s burst 20
    per_ip_bandwidth 1m/s burst 256k

    # Close connections that move fewer than 512 bytes in 10 s (slowloris),
    # or nothing at all for 5 minutes.
    min_rate 512 per 10s
    idle_timeout 5m
    connect_timeout 5s

    buffer 16k
    table_size 65536
    table_full deny
}
